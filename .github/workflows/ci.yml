name: SimaX CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation
        run: python3 scripts/check_docs.py
  application:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Python environment
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Check Python and JavaScript
        run: |
          .venv/bin/python -m compileall -q simax
          node --check simax/static/app.js
      - name: Run API, persistence and recovery tests
        run: .venv/bin/python -m pytest -q
      - name: Build distributable wheel
        run: .venv/bin/python -m pip wheel . --no-deps --wheel-dir build/wheels
